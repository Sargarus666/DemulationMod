<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Demulation game preview source</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  body { font-family: "DejaVu Sans", Arial, sans-serif; }

  .screen {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 18% 18%, rgba(255, 210, 120, .18) 0 6%, transparent 26%),
      radial-gradient(ellipse at 72% 62%, rgba(190, 110, 40, .22) 0 8%, transparent 30%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 5px),
      linear-gradient(145deg, #b98a4d 0%, #8a6036 32%, #a87a43 55%, #6f4d2c 100%);
    image-rendering: pixelated;
  }

  /* Dunes */
  .dune { position: absolute; border-radius: 50%; filter: blur(.4px); opacity: .55; }
  .d1 { width: 420px; height: 150px; left: -60px; top: 70px; background: linear-gradient(180deg, #d5a85e, #8d6338); transform: rotate(-9deg); }
  .d2 { width: 520px; height: 180px; left: 260px; top: 250px; background: linear-gradient(180deg, #c99955, #7e5731); transform: rotate(7deg); }
  .d3 { width: 380px; height: 130px; left: 620px; top: 60px; background: linear-gradient(180deg, #d8ad67, #8e6539); transform: rotate(-5deg); }
  .d4 { width: 460px; height: 170px; left: 120px; top: 520px; background: linear-gradient(180deg, #c29150, #73502d); transform: rotate(4deg); }

  /* Sand ridges / pixel texture */
  .ridges {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(12deg, transparent 0 16px, rgba(255,220,150,.10) 16px 18px, transparent 18px 38px),
      repeating-linear-gradient(-7deg, transparent 0 22px, rgba(60,35,15,.16) 22px 24px, transparent 24px 48px);
    mix-blend-mode: overlay;
  }

  /* Terrain details */
  .rock { position: absolute; width: 10px; height: 7px; background: #5f4226; box-shadow: 4px 3px 0 #4a331e, -3px 2px 0 #7a5834; transform: rotate(12deg); }
  .r1 { left: 82px; top: 148px; } .r2 { left: 360px; top: 94px; } .r3 { left: 500px; top: 420px; }
  .r4 { left: 740px; top: 300px; } .r5 { left: 180px; top: 620px; } .r6 { left: 880px; top: 550px; }

  /* Roads */
  .road { position: absolute; height: 12px; background: rgba(75, 51, 28, .55); border-top: 2px solid rgba(255,220,150,.18); }
  .road.a { left: 0; top: 330px; width: 820px; transform: rotate(3deg); }
  .road.b { left: 380px; top: 0; width: 14px; height: 720px; transform: rotate(-8deg); }

  /* Base structures */
  .base { position: absolute; left: 180px; top: 300px; width: 190px; height: 145px; }
  .wall { position: absolute; border: 5px solid #3f2c19; background: #9d7341; box-shadow: inset 0 0 0 3px #c49a58; }
  .w1 { left: 0; top: 0; width: 190px; height: 16px; }
  .w2 { left: 0; bottom: 0; width: 190px; height: 16px; }
  .w3 { left: 0; top: 0; width: 16px; height: 145px; }
  .w4 { right: 0; top: 0; width: 16px; height: 145px; }
  .keep { position: absolute; left: 62px; top: 41px; width: 66px; height: 62px; background: #6d4b2a; border: 5px solid #e0b26a; box-shadow: 0 0 0 4px #2e2012; }
  .keep::after { content: ""; position: absolute; left: 19px; top: -24px; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 28px solid #d6a55e; }
  .tower { position: absolute; width: 26px; height: 26px; background: #7d5832; border: 4px solid #d6a55e; }
  .t1 { left: 22px; top: 22px; } .t2 { right: 22px; top: 22px; } .t3 { left: 22px; bottom: 22px; } .t4 { right: 22px; bottom: 22px; }

  /* Units */
  .unit { position: absolute; width: 18px; height: 18px; background: #d8c27a; border: 3px solid #3a2a16; box-shadow: 0 0 0 2px #8e6a3a; }
  .unit::after { content: ""; position: absolute; left: 3px; top: -9px; width: 6px; height: 9px; background: #b89552; }
  .u1 { left: 430px; top: 360px; } .u2 { left: 478px; top: 390px; } .u3 { left: 520px; top: 340px; }
  .u4 { left: 620px; top: 470px; } .u5 { left: 690px; top: 430px; }
  .unit.enemy { background: #a34e3a; border-color: #2b140f; box-shadow: 0 0 0 2px #6d2f24; }
  .e1 { left: 780px; top: 210px; } .e2 { left: 840px; top: 250px; } .e3 { left: 760px; top: 610px; }

  /* Selection marker */
  .selection { position: absolute; left: 420px; top: 350px; width: 40px; height: 40px; border: 3px dashed #f2d27f; transform: rotate(45deg); }

  /* Right HUD */
  .hud {
    position: absolute; right: 0; top: 0; width: 320px; height: 720px;
    background: linear-gradient(180deg, #15120d 0%, #241b10 48%, #100d09 100%);
    border-left: 6px solid #c9a25d;
    box-shadow: inset 8px 0 18px rgba(0,0,0,.8), -8px 0 20px rgba(0,0,0,.5);
    padding: 18px 18px 16px;
  }
  .hud::before { content: ""; position: absolute; inset: 10px; border: 2px solid rgba(214,171,96,.35); pointer-events: none; }

  .credits-label { color: #9d8352; font-size: 13px; letter-spacing: 2px; text-align: right; }
  .credits {
    color: #f0c46e; font-family: "DejaVu Sans Mono", monospace; font-size: 36px; font-weight: 700;
    text-align: right; letter-spacing: 3px; text-shadow: 0 0 8px rgba(240,196,110,.35); margin-top: 2px;
  }
  .divider { height: 3px; margin: 14px 0; background: linear-gradient(90deg, transparent, #c39a55, transparent); }

  .buttons { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .hudbtn {
    width: 86px; height: 86px; position: relative;
    background: linear-gradient(145deg, #4a351d, #21170d);
    border: 4px solid #d2a659;
    box-shadow: inset 0 0 0 3px #1a120a, 0 0 0 2px #77582f;
  }
  .hudbtn::before { content: ""; position: absolute; inset: 8px; border: 2px solid rgba(236,199,126,.45); }
  .icon { position: absolute; inset: 20px; }
  .icon.units::before, .icon.units::after { content: ""; position: absolute; top: 18px; width: 16px; height: 16px; background: #e2ba6f; border: 3px solid #1c130a; }
  .icon.units::before { left: 2px; } .icon.units::after { right: 2px; }
  .icon.base::before { content: ""; position: absolute; left: 6px; right: 6px; bottom: 4px; height: 20px; background: #e2ba6f; border: 3px solid #1c130a; }
  .icon.base::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 18px; background: #e2ba6f; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .icon.menu::before, .icon.menu::after { content: ""; position: absolute; left: 5px; right: 5px; height: 7px; background: #e2ba6f; }
  .icon.menu::before { top: 10px; } .icon.menu::after { top: 28px; }

  .radar {
    position: relative; width: 220px; height: 220px; margin: 18px auto 0;
    border: 5px solid #c9a25d; background: radial-gradient(circle, #2b3a26 0 34%, #1a2a1c 35% 68%, #101a12 69% 100%);
    box-shadow: inset 0 0 24px rgba(0,0,0,.9), 0 0 0 3px #1a120a;
    overflow: hidden;
  }
  .radar::before, .radar::after { content: ""; position: absolute; background: rgba(214,180,105,.28); }
  .radar::before { left: 50%; top: 0; width: 1px; height: 100%; }
  .radar::after { top: 50%; left: 0; height: 1px; width: 100%; }
  .sweep { position: absolute; left: 50%; top: 50%; width: 45%; height: 45%; transform-origin: 0 0; background: conic-gradient(from 0deg, rgba(120,200,120,.35), transparent 70deg); }
  .blip { position: absolute; width: 7px; height: 7px; background: #f2d27f; box-shadow: 0 0 6px #f2d27f; }
  .b1 { left: 68px; top: 74px; } .b2 { left: 145px; top: 120px; } .b3 { left: 96px; top: 160px; }

  .panel-line { display: flex; gap: 6px; margin-top: 18px; }
  .bar { height: 12px; flex: 1; background: repeating-linear-gradient(90deg, #5d4324 0 10px, #2d2012 10px 13px); border: 2px solid #8c6a3b; }
  .bar.active { background: repeating-linear-gradient(90deg, #d5a75c 0 10px, #8d6a37 10px 13px); }
  .status { margin-top: 16px; color: #b9975d; font-size: 12px; letter-spacing: 1.5px; text-align: center; }

  /* Bottom info strip over the game area */
  .topbar {
    position: absolute; left: 18px; top: 16px; height: 38px; padding: 0 16px;
    display: flex; align-items: center; gap: 22px;
    background: rgba(18,13,8,.76); border: 2px solid rgba(211,169,98,.6);
    color: #e8c884; font-size: 14px; letter-spacing: 1px;
  }
  .topbar b { color: #fff0c8; }

  /* Version / fixes banner burned into the screenshot */
  .banner {
    position: absolute; left: 0; right: 320px; bottom: 0; min-height: 118px;
    background: linear-gradient(90deg, rgba(10,8,5,.94), rgba(18,13,8,.9) 70%, rgba(10,8,5,.6));
    border-top: 4px solid #d8ab5f; padding: 18px 26px 16px;
    display: flex; align-items: center; gap: 26px;
  }
  .version {
    flex: 0 0 auto; color: #f3c979; font-family: "DejaVu Sans Mono", monospace;
    font-size: 34px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 10px rgba(243,201,121,.35);
  }
  .version small { display: block; font-size: 13px; color: #b89558; letter-spacing: 2px; margin-top: 4px; }
  .fixes { color: #f0e2c4; font-size: 19px; line-height: 1.45; }
  .fixes span { color: #d9b06a; font-weight: 700; }
  .fixlist { margin-top: 6px; color: #cbb994; font-size: 15px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="dune d1"></div><div class="dune d2"></div><div class="dune d3"></div><div class="dune d4"></div>
    <div class="ridges"></div>
    <div class="road a"></div><div class="road b"></div>
    <div class="rock r1"></div><div class="rock r2"></div><div class="rock r3"></div>
    <div class="rock r4"></div><div class="rock r5"></div><div class="rock r6"></div>

    <div class="base">
      <div class="wall w1"></div><div class="wall w2"></div><div class="wall w3"></div><div class="wall w4"></div>
      <div class="keep"></div>
      <div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div><div class="tower t4"></div>
    </div>

    <div class="selection"></div>
    <div class="unit u1"></div><div class="unit u2"></div><div class="unit u3"></div>
    <div class="unit u4"></div><div class="unit u5"></div>
    <div class="unit enemy e1"></div><div class="unit enemy e2"></div><div class="unit enemy e3"></div>

    <div class="topbar">
      <span>ARRakis · <b>SECTOR 09</b></span>
      <span>SPICE <b>84%</b></span>
      <span>UNIT <b>06/12</b></span>
    </div>

    <div class="hud">
      <div class="credits-label">CREDITS</div>
      <div class="credits">13450</div>
      <div class="divider"></div>
      <div class="buttons">
        <div class="hudbtn"><div class="icon units"></div></div>
        <div class="hudbtn"><div class="icon base"></div></div>
        <div class="hudbtn"><div class="icon menu"></div></div>
      </div>
      <div class="radar">
        <div class="sweep"></div>
        <div class="blip b1"></div><div class="blip b2"></div><div class="blip b3"></div>
      </div>
      <div class="panel-line">
        <div class="bar active"></div><div class="bar active"></div><div class="bar"></div>
      </div>
      <div class="status">TACTICAL LINK · ONLINE</div>
    </div>

    <div class="banner">
      <div class="version">v0.4.768 FIXED<small>DEMULATION · DUNE SEGA HUD</small></div>
      <div>
        <div class="fixes"><span>Исправлено:</span> вылет при запуске ROM и ошибки верификации DEX.</div>
        <div class="fixlist">Сохранены квадратные кнопки над радаром, цифры кредитов и оформление в стиле Dune на Sega Genesis.</div>
      </div>
    </div>
  </div>
</body>
</html>
